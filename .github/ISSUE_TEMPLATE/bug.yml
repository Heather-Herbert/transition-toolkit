name: Bug report
description: Something does not work, or works wrongly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **This issue is public.** Do not post medication, doses, blood results or anything that identifies you.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe what you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen again
      placeholder: |
        1. Open ...
        2. Tap ...
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings > About.
  - type: input
    id: phone
    attributes:
      label: Phone and Android version
      placeholder: e.g. Pixel 7, Android 16
  - type: dropdown
    id: part
    attributes:
      label: Which part of the app?
      options:
        - Doses and reminders
        - Bloods and charts
        - Stock and prescriptions
        - GP summary PDF
        - Name-change checklist
        - App lock or discreet mode
        - Backup and restore
        - A plugin
        - Something else
