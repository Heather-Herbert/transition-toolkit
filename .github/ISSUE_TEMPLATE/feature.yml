name: Feature idea
description: Something you would like the app to do.
labels: [feature]
body:
  - type: markdown
    attributes:
      value: |
        **This issue is public.** Do not post medication, doses, blood results or anything that identifies you.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve for you?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like the app to do?
    validations:
      required: true
